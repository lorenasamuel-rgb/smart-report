<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Report · Risk Signaling &amp; Report Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2063;          /* Smart Report deep navy */
  --ink-soft:#3c4076;
  --blue:#2f62f6;         /* bright blue */
  --blue-dark:#1e46c0;
  --peri:#aebcec;         /* periwinkle */
  --peri-pale:#e7ebfa;
  --peri-ghost:#f4f6fd;
  --pink:#e8336e;         /* critical signal (Smart Report slide accent) */
  --pink-soft:#fdeaf1;
  --orange:#e0731d;       /* attention (Smart Report secondary burst) */
  --orange-soft:#fcefe2;
  --green:#15895c;
  --green-soft:#e3f4ec;
  --line:#dfe4f4;
  --card:#ffffff;
  --radius:14px;
  --shadow:0 1px 2px rgba(29,32,99,.06),0 8px 24px -12px rgba(29,32,99,.12);
  --font-display:'Lato',sans-serif;
  --font-body:'Lato',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--peri-ghost);
  font-size:14px;line-height:1.5;min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- decorative bursts (Smart Report quarter-fan motif) ---------- */
.burst{position:fixed;z-index:0;pointer-events:none;opacity:.55}
.burst.tr{top:-40px;right:-40px;width:240px}
.burst.bl{bottom:-50px;left:-50px;width:280px;transform:rotate(180deg)}
@media(max-width:760px){.burst{display:none}}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
}
.hd-top{
  max-width:1120px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.wordmark{font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:-.5px;color:var(--ink)}
.wordmark em{font-style:normal;color:var(--blue)}
.product-chip{
  font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--blue-dark);
  background:var(--peri-pale);border:1px solid var(--peri);border-radius:999px;padding:3px 12px;
}
.proto-tag{font-size:12px;color:var(--ink-soft)}
.watch-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.watch-wrap[hidden]{display:none}
.watch-orb{
  position:relative;
  width:48px;height:48px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:var(--green-soft);border:2px solid var(--green);color:var(--green);
  box-shadow:var(--shadow);
}
.watch-orb .bot-face{display:block}
.watch-orb .watch-num{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;padding:0 4px;
  border-radius:999px;border:2px solid #fff;
  background:var(--green);color:#fff;
  font-family:var(--font-display);font-weight:900;font-size:11px;line-height:14px;
}
.watch-orb .watch-num:empty{display:none}
.watch-orb.attention{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.watch-orb.attention .watch-num{background:var(--orange)}
.watch-orb.critical{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.watch-orb.critical .watch-num{background:var(--pink)}
.watch-orb:hover{transform:translateY(-1px)}
@keyframes intakePop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.watch-orb.incoming{animation:intakePop .7s ease 2}
.watch-tip{
  position:absolute;top:calc(100% + 10px);right:0;z-index:41;
  width:max-content;max-width:220px;
  padding:8px 12px;border-radius:12px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--ink);font-size:13px;font-weight:700;line-height:1.3;text-align:left;
  pointer-events:none;visibility:hidden;
}
.watch-orb:hover .watch-tip,
.watch-orb:focus-visible .watch-tip{visibility:visible}
.watch-orb[aria-expanded="true"] .watch-tip{visibility:hidden}
.watch-pop{
  position:absolute;top:calc(100% + 10px);right:0;z-index:40;
  width:min(360px,calc(100vw - 32px));
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:6px;
}
.watch-pop[hidden]{display:none}
.watch-item{display:block;width:100%;text-align:left;border-radius:12px;padding:10px 12px}
.watch-item:hover{background:var(--peri-ghost)}
.watch-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.watch-item-top strong{font-size:14px}
.watch-act{display:block;margin-top:4px;font-size:13px;color:var(--ink-soft);font-weight:400}
.watch-due{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--ink)}
.watch-empty{padding:12px;color:var(--ink-soft);font-size:13px}
.hd-controls{
  max-width:1120px;margin:0 auto;padding:0 24px 14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.seg{display:flex;background:var(--peri-pale);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{
  padding:7px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft);
  transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lvl-wrap{display:flex;align-items:center;gap:10px}
.lvl-wrap label{font-size:13px;font-weight:600;color:var(--ink-soft)}
select#level, select#lang{
  font:inherit;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--peri);
  border-radius:10px;padding:7px 10px;cursor:pointer;
}
html[lang="zh-Hans"] body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",var(--font-body)}
.lvl-note{font-size:12.5px;color:var(--ink-soft);max-width:380px}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:28px 24px 72px;position:relative;z-index:1}
.view-title{font-family:var(--font-display);font-weight:600;font-size:21px;margin-bottom:4px}
.view-sub{color:var(--ink-soft);margin-bottom:22px;max-width:640px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px 12px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--peri),var(--shadow)}
.tile .num{font-family:var(--font-display);font-weight:700;font-size:27px;line-height:1.1;color:var(--ink)}
.tile .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:3px}
.tile.critical .num{color:var(--pink)}
.tile.attention .num{color:var(--orange)}
.tile.clear .num{color:var(--green)}
.dash-wide{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 20px 16px;margin-bottom:22px;
}
.dash-wide h3{font-family:var(--font-display);font-weight:600;font-size:14px}
.statusbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 10px;background:var(--peri-pale)}
.statusbar i{display:block;height:100%}
.statusbar i+i{border-left:2px solid #fff}
.sb-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);align-items:center}
.sb-legend span{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.sb-legend button{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;color:var(--ink-soft);border:1px solid transparent;border-radius:8px;padding:4px 9px}
.sb-legend button:hover{background:var(--peri-ghost)}
.sb-legend button[aria-pressed="true"]{border-color:var(--blue);background:var(--peri-pale);color:var(--ink)}
.sb-legend .sw{width:10px;height:10px;border-radius:3px}
.sb-legend .checks{margin-left:auto;font-weight:500}
@media(max-width:620px){.sb-legend .checks{margin-left:0;width:100%}}

/* ---------- queue ---------- */
.queue{display:flex;flex-direction:column;gap:10px}
.case-row{
  display:grid;grid-template-columns:24px 135px 1.2fr 105px 210px minmax(110px,1fr) 110px;gap:13px;align-items:center;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;box-shadow:var(--shadow);text-align:left;width:100%;
  transition:border-color .15s, transform .15s;
}
.case-row:hover{border-color:var(--blue);transform:translateY(-1px)}
.case-row .who strong{display:block;font-weight:600;font-size:15.5px}
.case-row .who span{font-size:13px;color:var(--ink-soft)}
.case-row .pkg{font-size:13px;color:var(--ink-soft)}
.case-row .due{font-size:13px;color:var(--ink-soft)}
.case-row .due strong{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.open-link{color:var(--blue);font-weight:600;font-size:13.5px;justify-self:end}
.signal-reason{
  grid-column:1/-1;margin-top:2px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:13.5px;color:var(--ink-soft);
}
.signal-reason b{color:var(--ink);font-weight:600}
@media(max-width:860px){
  .case-row{grid-template-columns:1fr 1fr}
  .open-link{justify-self:start}
}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12px;
  border-radius:999px;padding:5px 12px;white-space:nowrap;font-family:var(--font-display);
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.critical{background:var(--pink-soft);color:var(--pink)}
.badge.attention{background:var(--orange-soft);color:var(--orange)}
.badge.routine{background:var(--peri-pale);color:var(--blue-dark)}
.badge.clear{background:var(--green-soft);color:var(--green)}
.badge.pending{background:#f0f1f6;color:var(--ink-soft)}
.badge.critical .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* progress */
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.prog .bar{flex:1;height:6px;border-radius:4px;background:var(--peri-pale);overflow:hidden;min-width:48px}
.prog .bar i{display:block;height:100%;background:var(--blue);border-radius:4px}

/* ---------- report ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13.5px;margin-bottom:18px}
.report-head{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px;
}
.rh-main{padding:22px 24px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.rh-main h2{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.2}
.rh-main .meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.rh-badges{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rh-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--line);background:var(--peri-ghost);
}
.rh-grid>div{padding:13px 24px;border-right:1px solid var(--line)}
.rh-grid>div:last-child{border-right:0}
.rh-grid .k{font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.rh-grid .v{font-weight:600;font-size:14px;margin-top:2px}
.signal-banner{
  display:flex;gap:12px;align-items:flex-start;padding:15px 24px;font-size:14px;
  border-top:1px solid var(--line);
}
.signal-banner.critical{background:var(--pink-soft);color:#8e1744}
.signal-banner.attention{background:var(--orange-soft);color:#7c4007}
.signal-banner.routine{background:var(--peri-pale);color:var(--blue-dark)}
.signal-banner.clear{background:var(--green-soft);color:#0c5e3e}
.signal-banner svg{flex:none;margin-top:2px}
.signal-banner b{font-weight:700}

/* sections */
.section{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.sec-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.sec-head h3{font-family:var(--font-display);font-weight:600;font-size:16px;flex:1}
.sec-head .lvl-pill{
  font-size:11px;font-weight:700;color:var(--blue-dark);background:var(--peri-pale);
  border-radius:6px;padding:2px 8px;font-family:var(--font-display);
}
.sec-body{padding:6px 22px 18px}
.sec-locked{
  display:flex;align-items:center;gap:14px;padding:18px 22px;color:var(--ink-soft);font-size:14px;
  background:repeating-linear-gradient(135deg,#fff,#fff 10px,var(--peri-ghost) 10px,var(--peri-ghost) 20px);
}
.sec-locked b{color:var(--ink)}

/* findings */
.finding{padding:14px 0;border-bottom:1px solid var(--peri-pale)}
.finding:last-child{border-bottom:0}
.f-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.f-top h4{font-size:14.5px;font-weight:600;flex:1;min-width:200px}
.f-note{font-size:13.5px;color:var(--ink-soft);margin-top:5px;max-width:640px}
.compare{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;max-width:680px;
}
.compare>div{border-radius:10px;padding:10px 14px;font-size:13.5px;border:1px solid var(--line)}
.compare .claimed{background:var(--peri-ghost)}
.compare .verified-ok{background:var(--green-soft);border-color:#bfe4d2}
.compare .verified-bad{background:var(--pink-soft);border-color:#f3bfd2}
.compare .verified-warn{background:var(--orange-soft);border-color:#eccfae}
.compare .k{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:3px}
.compare mark{background:#ffd3e2;color:#8e1744;border-radius:3px;padding:0 3px;font-weight:600}
.compare mark.warn{background:#fadfbe;color:#7c4007}
@media(max-width:620px){.compare{grid-template-columns:1fr}}

/* citations */
.cite{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:19px;height:19px;padding:0 5px;margin:0 2px;vertical-align:2px;
  border-radius:6px;background:var(--peri-pale);border:1px solid var(--peri);
  color:var(--blue-dark);font-size:11px;font-weight:700;
  transition:background .12s,color .12s;
}
.cite:hover,.cite.active{background:var(--blue);border-color:var(--blue);color:#fff}
.cite.sla{width:auto;font-size:10.5px}
.adj-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ghost-btn{font-size:13px;font-weight:600;color:var(--blue-dark);background:#fff;border:1.5px solid var(--peri);border-radius:10px;padding:7px 14px}
.ghost-btn:hover{background:var(--peri-ghost)}
.ghost-btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.ghost-btn[disabled]{opacity:.6;cursor:default}
.ctx-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ctx-hint{font-size:11.5px;color:var(--ink-soft)}
.due .eta{display:block;font-style:normal;color:var(--blue-dark);font-weight:600;font-size:12px;margin-top:2px}
.ctx-banner{margin:14px 28px 4px;background:var(--peri-pale);border:1px solid var(--peri);border-radius:12px;padding:13px 16px;font-size:13px}

/* ---------- assessment / adjudication ---------- */
.adj-cell{font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.adj-cell .k{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:#9aa1c4;letter-spacing:.03em;margin-bottom:2px}
.adj-cell.todo{color:var(--orange)}
.decide{display:flex;align-items:center;gap:10px;padding:13px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.decide .k{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.btn-solid{background:var(--green);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:8px 16px}
.btn-solid:hover{background:#0f6b45}
.btn-danger{background:#fff;color:var(--pink);border:1.5px solid var(--pink);font-weight:700;font-size:13px;border-radius:10px;padding:8px 16px}
.btn-danger:hover{background:var(--pink-soft)}
.btn-danger[disabled]{opacity:.45;cursor:not-allowed}
.rule-intro{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--peri-pale)}
.rule:last-child{border-bottom:0}
.rule .rid{flex:none;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--blue-dark);background:var(--peri-pale);border-radius:6px;padding:3px 8px;margin-top:1px;white-space:nowrap}
.rule .rtxt{flex:1;font-size:13px;color:var(--ink-soft);line-height:1.5}
.rule .rtxt b{display:block;color:var(--ink);font-weight:600;font-size:12px;margin-bottom:1px}
.rule.current{background:#fff9e3;box-shadow:0 0 0 2px #ecd96e;border-radius:10px;padding:12px 10px;border-bottom:0}

/* ---------- source drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(29,32,99,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:50;background:#fff;
  box-shadow:-12px 0 40px -18px rgba(29,32,99,.35);transform:translateX(102%);
  transition:transform .25s ease;display:flex;flex-direction:column;
}
body.drawer-open .drawer{transform:none}
body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}
.dw-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dw-head .num{
  flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  font-family:var(--font-display);
}
.dw-head h4{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.3}
.dw-head .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.dw-close{margin-left:auto;flex:none;width:30px;height:30px;border-radius:8px;background:var(--peri-ghost);font-size:15px;color:var(--ink-soft)}
.dw-close:hover{background:var(--peri-pale)}
.dw-body{flex:1;overflow-y:auto;padding:20px 22px}
.dw-doc{
  background:var(--peri-ghost);border:1px solid var(--line);border-radius:12px;padding:18px 18px;
  font-size:13.5px;line-height:1.65;color:var(--ink-soft);
}
.dw-doc p{margin-bottom:12px}
.dw-doc p:last-child{margin-bottom:0}
.dw-doc mark{
  background:#fff3a8;color:var(--ink);padding:1px 4px;border-radius:4px;font-weight:600;
  box-shadow:0 0 0 1.5px #ecd96e;
}
.dw-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;margin:20px 0 8px}
.dw-list{display:flex;flex-direction:column;gap:6px}
.dw-list button{
  display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);font-size:13px;background:#fff;
}
.dw-list button:hover{border-color:var(--blue);background:var(--peri-ghost)}
.dw-list .n{flex:none;width:21px;height:21px;border-radius:6px;background:var(--peri-pale);color:var(--blue-dark);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dw-list button.current{border-color:var(--blue);background:var(--peri-pale)}

/* ---------- queue search + export bar ---------- */
.qbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.qbar .search-wrap{flex:1;min-width:220px;margin-bottom:0}
.date-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:var(--shadow)}
.date-search label{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.date-search select,.date-search input{font:inherit;font-weight:600;font-size:13px;color:var(--ink);background:#fff;border:1.5px solid var(--peri);border-radius:8px;padding:6px 8px}
.sel{display:flex;align-items:center;justify-content:center}
.sel input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.exp-group{display:flex;align-items:center;gap:8px}
.exp-group .k{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 16px 11px 42px;box-shadow:var(--shadow)}
.search-wrap input:focus{border-color:var(--blue);outline:none}
.search-wrap input::placeholder{color:#9aa1c4}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.queue-empty{background:var(--card);border:1px dashed var(--peri);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-soft);font-size:14px}
.intake{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px 8px;margin:0 0 16px}
.intake-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.intake-head > div:first-child{flex:1;min-width:0}
.intake-head h3{font-family:var(--font-display);font-weight:600;font-size:15px}
.intake-head p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.intake-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.intake-ctrls{display:flex;gap:6px}
.intake-head b{font-size:13px;color:var(--blue-dark);white-space:nowrap}
.intake.paused b{color:var(--ink-soft)}
.intake-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.intake-row .who{display:flex;flex-direction:column;flex:1;min-width:0}
.intake-row .who strong{font-size:14px}
.intake-row .who span{font-size:12.5px;color:var(--ink-soft)}
.intake-row em{font-style:normal;font-size:11px;font-weight:700;color:var(--blue-dark)}
.intake-empty{font-size:13px;color:var(--ink-soft);padding:4px 0 10px}
.case-row.fresh{border-color:var(--blue);box-shadow:0 0 0 2px var(--peri),var(--shadow)}

/* ---------- ask this report ---------- */
.chat-note{font-size:11.5px;color:var(--ink-soft);font-weight:500;max-width:320px;text-align:right}
.chat-log{display:flex;flex-direction:column;gap:10px;padding:14px 0 4px}
.msg{max-width:85%;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}
.msg.ai{background:var(--peri-ghost);border:1px solid var(--peri-pale);align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 4px}
.chips-row button{font-size:12.5px;font-weight:600;color:var(--blue-dark);background:var(--peri-pale);border:1px solid var(--peri);border-radius:999px;padding:6px 13px;text-align:left}
.chips-row button:hover{background:var(--peri);color:var(--ink)}
.chat-input{display:flex;gap:8px;padding:8px 0 2px}
.chat-input input{flex:1;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px}
.chat-input input:focus{border-color:var(--blue);outline:none}
.chat-input button{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 18px}
.chat-input button:hover{background:var(--blue-dark)}

/* ---------- candidate view ---------- */
.cand-card{
  max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
}
.cand-hero{padding:26px 28px 20px;background:linear-gradient(135deg,var(--ink) 0%,#2a2f8f 70%,var(--blue-dark) 100%);color:#fff}
.cand-hero h2{font-family:var(--font-display);font-weight:600;font-size:20px}
.cand-hero p{opacity:.85;font-size:13.5px;margin-top:4px}
.cand-prog{margin-top:18px}
.cand-prog .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.cand-prog .bar i{display:block;height:100%;background:#fff;border-radius:5px}
.cand-prog span{font-size:12.5px;opacity:.85;display:block;margin-top:7px}
.cand-rows{padding:8px 28px 10px}
.cand-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--peri-pale)}
.cand-row:last-child{border-bottom:0}
.cand-row .nm{flex:1;font-weight:600;font-size:14.5px}
.cand-row .sub{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.cand-foot{padding:16px 28px 22px;background:var(--peri-ghost);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft)}
.cand-foot b{color:var(--ink)}

.cand-picker button{

}
.cand-picker button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--ink-soft);position:relative;z-index:1}

.report-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.report-top .backlink{margin-bottom:0}
.print-only,.print-foot{display:none}

const state = { role:"recruiter", level:3, view:"queue", caseId:null, candId:CASES[0].id, src:null, q:"", dateField:"any", date:"", ctxReq:{}, ctxSent:{}, decisions:{}, filter:null, selected:{}, watchOpen:false };
const FILTERS={
  critical:c=>c.signal==="critical",
  attention:c=>c.signal==="attention",
  disc:c=>c.sections.some(s=>s.findings.some(f=>f.kind==="discrepancy")),
  review:c=>c.status==="review",
  progress:c=>c.status==="progress",
  clear:c=>c.status==="clear"
};
const app = document.getElementById("app");
const SIGNAL_LABEL = { critical:"Critical", attention:"Attention", routine:"Routine" };
function sigLabel(s){return t(s==="critical"?"sigCritical":s==="attention"?"sigAttention":"sigRoutine")}
function statusPair(status){
  const map={verified:["clear","stVerified"],discrepancy:["critical","stDiscrepancy"],record:["critical","stRecord"],attention:["attention","stAttention"],pending:["pending","stPending"]};
  const [k,key]=map[status]||["pending","stPending"];
  return [k, t(key)];
}
function applyChrome(){
  document.title=t("docTitle");
  const proto=document.getElementById("protoTag"); if(proto) proto.textContent=t("proto");
  const rr=document.getElementById("roleRecruiter"); if(rr) rr.textContent=t("roleRecruiter");
  const rc=document.getElementById("roleCandidate"); if(rc) rc.textContent=t("roleCandidate");
  const seg=document.querySelector(".seg"); if(seg) seg.setAttribute("aria-label", t("roleGroup"));
  const al=document.getElementById("accessLabel"); if(al) al.textContent=t("access");
  const ll=document.getElementById("langLabel"); if(ll) ll.textContent=t("langLabel");
  const sla=document.getElementById("slaBtn"); if(sla) sla.textContent=t("slaBtn");
  const foot=document.getElementById("pageFoot"); if(foot) foot.textContent=t("footer");
  const lvl=document.getElementById("level");
  if(lvl) [...lvl.options].forEach(o=>{o.textContent=t("levelN",{n:o.value})});
  const note=document.getElementById("lvlNote");
  if(note) note.textContent=t("lvl"+state.level);
  const langSel=document.getElementById("lang");
  if(langSel) langSel.title=t("langHint");
}
const SIGNAL_ORDER = { critical:0, attention:1, routine:2 };
const STATUS_BADGE = {
  verified:["clear","Verified"], discrepancy:["critical","Discrepancy found"],
  record:["critical","Record found"], attention:["attention","Needs attention"],
  pending:["pending","In progress"]
};
const esc = s => s==null ? "" : String(s);
const escq = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const icons = {
  alert:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3 2.5 20h19L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8.5 12.2 2.4 2.4 4.6-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="2"/></svg>',
  back:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function badge(kind,label,extra=""){return `<span class="badge ${kind} ${extra}"><span class="dot"></span>${label}</span>`}
function prog(c){const [d,t]=c.progress;return `<div class="prog"><div class="bar"><i style="width:${Math.round(d/t*100)}%"></i></div><span>${d}/${t}</span></div>`}
function citeChips(c,cites){
  if(!cites||!cites.length) return "";
  return cites.map(n=>`<button class="cite" data-case="${c.id}" data-src="${n}" aria-label="${escq(t("openSource",{n}))}">${n}</button>`).join("");
}

function renderQueue(){
  const cases=[...CASES].sort((a,b)=>SIGNAL_ORDER[a.signal]-SIGNAL_ORDER[b.signal]);
  const sig=s=>CASES.filter(c=>c.signal===s).length;
  const st=s=>CASES.filter(c=>c.status===s).length;
  const disc=CASES.reduce((n,c)=>n+c.sections.reduce((m,x)=>m+x.findings.filter(f=>f.kind==="discrepancy").length,0),0);
  const done=CASES.reduce((n,c)=>n+c.progress[0],0), tot=CASES.reduce((n,c)=>n+c.progress[1],0);
  const nR=st("review"), nP=st("progress"), nC=st("clear"), total=CASES.length;
  const pc=n=>(n/total*100).toFixed(1)+"%";
  app.innerHTML = `
    <h1 class="view-title">${t("queueTitle")}</h1>
    <p class="view-sub">${t("queueSub")}</p>
    ${intakeHTML()}
    <div class="dash">
      <button class="tile" data-filter="" aria-pressed="${state.filter===null}"><div class="num">${total}</div><div class="lbl">${t("tileActive")}</div></button>
      <button class="tile critical" data-filter="critical" aria-pressed="${state.filter==="critical"}"><div class="num">${sig("critical")}</div><div class="lbl">${t("tileCritical")}</div></button>
      <button class="tile attention" data-filter="attention" aria-pressed="${state.filter==="attention"}"><div class="num">${sig("attention")}</div><div class="lbl">${t("tileAttention")}</div></button>
      <button class="tile" data-filter="disc" aria-pressed="${state.filter==="disc"}"><div class="num">${disc}</div><div class="lbl">${t("tileDisc")}</div></button>
      <button class="tile clear" data-filter="clear" aria-pressed="${state.filter==="clear"}"><div class="num">${nC}</div><div class="lbl">${t("tileClear")}</div></button>
    </div>
    <div class="dash-wide">
      <h3>${t("statusHeading")}</h3>
      <div class="statusbar" role="img" aria-label="${t("ariaStatus",{nR,nP,nC})}">
        ${nR?`<i style="width:${pc(nR)};background:var(--pink)"></i>`:""}
        ${nP?`<i style="width:${pc(nP)};background:var(--blue)"></i>`:""}
        ${nC?`<i style="width:${pc(nC)};background:var(--green)"></i>`:""}
      </div>
      <div class="sb-legend">
        <button data-filter="review" aria-pressed="${state.filter==="review"}"><i class="sw" style="background:var(--pink)"></i>${t("needReview")} · ${nR}</button>
        <button data-filter="progress" aria-pressed="${state.filter==="progress"}"><i class="sw" style="background:var(--blue)"></i>${t("inProgress")} · ${nP}</button>
        <button data-filter="clear" aria-pressed="${state.filter==="clear"}"><i class="sw" style="background:var(--green)"></i>${t("completeClear")} · ${nC}</button>
        <span class="checks">${t("checksDone",{done,tot})}</span>
      </div>
    </div>
    <div class="qbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="qSearch" type="search" placeholder="${escq(t("searchPh"))}" value="${escq(state.q)}" aria-label="${escq(t("searchAria"))}">
      </div>
      <div class="date-search">
        <label for="dateField">${t("dateLabel")}</label>
        <select id="dateField" aria-label="${escq(t("dateWhich"))}">
          <option value="any" ${state.dateField==="any"?"selected":""}>${t("dateAny")}</option>
          <option value="ordered" ${state.dateField==="ordered"?"selected":""}>${t("dateOrdered")}</option>
          <option value="due" ${state.dateField==="due"?"selected":""}>${t("dateDue")}</option>
          <option value="completed" ${state.dateField==="completed"?"selected":""}>${t("dateCompleted")}</option>
        </select>
        <input id="dateSearch" type="date" aria-label="${escq(t("dateAria"))}" value="${escq(state.date)}">
      </div>
      <button class="ghost-btn" id="xlsBtn" disabled>${t("excel")}</button>
      <button class="ghost-btn" id="zipBtn">${t("zipAll")}</button>
    </div>
    <div class="queue" id="queueList"></div>`;
  wireIntake();
  const listEl=document.getElementById("queueList");
  const zb=document.getElementById("zipBtn");
  const xb=document.getElementById("xlsBtn");
  const selectedCases=()=>CASES.filter(c=>state.selected[c.id]);
  const updateZipBtn=()=>{
    const n=selectedCases().length;
    zb.textContent=n?t("zipN",{n}):t("zipAll");
    xb.disabled=!n;
    xb.textContent=n?t("excelN",{n}):t("excel");
  };
  zb.addEventListener("click",()=>{
    const sel=selectedCases();
    zipAll(sel.length?sel:CASES,zb);
  });
  xb.addEventListener("click",()=>{
    const sel=selectedCases();
    if(!sel.length) return;
    if(!window.XLSX) return flash(xb,t("flashLib"));
    dl(listXlsx(sel),"smart-report-status.xlsx");
  });
  updateZipBtn();
  const ymd=raw=>{
    if(!raw) return "";
    const d=new Date(raw);
    if(Number.isNaN(d.getTime())) return "";
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  };
  const matchesDate=c=>{
    if(!state.date) return true;
    const fields=state.dateField==="any"?["ordered","due","completed"]:[state.dateField];
    return fields.some(f=>ymd(c[f])===state.date);
  };
  const drawList=()=>{
    const q=state.q.trim().toLowerCase();
    let shown=cases.filter(c=>{
      if(!matchesDate(c)) return false;
      if(!q) return true;
      const dates=[c.ordered,c.due,c.completed,c.eta].filter(Boolean).join(" ").toLowerCase();
      return c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)||(c.order||"").toLowerCase().includes(q)||dates.includes(q);
    });
    if(state.filter&&FILTERS[state.filter]) shown=shown.filter(FILTERS[state.filter]);
    listEl.innerHTML = shown.length ? shown.map(c=>`
        <div class="case-row${c.id===state.freshId?" fresh":""}" data-open="${c.id}" role="button" tabindex="0" aria-label="${escq(t("openReport",{name:c.name}))}">
          <label class="sel" title="${escq(t("selectTitle"))}"><input type="checkbox" data-sel="${c.id}" ${state.selected[c.id]?"checked":""} aria-label="${escq(t("selectAria",{name:c.name}))}"></label>
          ${badge(c.signal,sigLabel(c.signal))}
          <span class="who"><strong>${c.name}</strong><span>${c.role} · ${c.geo} · ${c.order}</span></span>
          ${badge(...assessOf(c))}
          <span class="adj-cell${adjCode(c)==="not"?" todo":""}"><i class="k">${t("adjLabel")}</i>${adjOf(c)}</span>
          ${prog(c)}
          <span class="due"><strong>${t("dueIn",{when:c.dueIn})}</strong>${c.due}${c.eta?`<em class="eta">${t("etaShort",{eta:c.eta})}</em>`:""}</span>
          <span class="signal-reason"><b>${t("whySignal")}</b> ${phrase(c.signalReason)}</span>
        </div>`).join("")
      : `<div class="queue-empty">${t("empty")}<br><button class="ghost-btn sm" data-clearall style="margin-top:10px">${t("showAll")}</button></div>`;
    listEl.querySelectorAll("[data-open]").forEach(row=>{
      const open=()=>{state.view="report";state.caseId=row.dataset.open;render();window.scrollTo(0,0)};
      row.addEventListener("click",e=>{if(e.target.closest(".sel"))return;open()});
      row.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest(".sel")){e.preventDefault();open()}});
    });
    listEl.querySelectorAll("[data-sel]").forEach(cb=>cb.addEventListener("change",()=>{state.selected[cb.dataset.sel]=cb.checked;updateZipBtn()}));
    const ca=listEl.querySelector("[data-clearall]");
    if(ca)ca.addEventListener("click",()=>{state.filter=null;state.q="";state.date="";state.dateField="any";render()});
  };
  drawList();
  const si=document.getElementById("qSearch");
  si.addEventListener("input",()=>{state.q=si.value;drawList()});
  document.getElementById("dateField").addEventListener("change",e=>{state.dateField=e.target.value;drawList()});
  document.getElementById("dateSearch").addEventListener("input",e=>{state.date=e.target.value;drawList()});
  app.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.filter;
    state.filter=(v===""||state.filter===v)?null:v;
    render();
  }));
}

function findingHTML(c,f){
  const sev = f.severity==="critical"?"verified-bad":f.severity==="attention"?"verified-warn":"verified-ok";
  const tag = f.kind==="discrepancy"
      ? badge(f.severity==="critical"?"critical":"attention", f.severity==="critical"?t("tagDisc"):t("tagCheck"))
      : f.kind==="note" ? badge("pending",t("tagPending")) : badge("clear",t("tagMatch"));
  const compare = (f.claimed||f.verified) ? `
    <div class="compare">
      <div class="claimed"><div class="k">${t("stated")}</div>${esc(f.claimed)||t("na")}</div>
      <div class="${sev}"><div class="k">${t("verifiedBy")}</div>${f.verified||t("pendingVal")}</div>
    </div>`:"";
  return `
    <div class="finding">
      <div class="f-top">${tag}<h4>${f.title} ${citeChips(c,f.cites)}</h4></div>
      ${compare}
      ${f.note?`<p class="f-note">${f.note} ${compare?"":citeChips(c,f.cites)}</p>`:""}
      ${f.ctx?`<div class="ctx-row">
        <button class="ghost-btn sm" data-ctx="${c.id}" ${state.ctxReq[c.id]?"disabled":""}>${state.ctxReq[c.id]?t("ctxOn"):t("ctxAsk")}</button>
        <span class="ctx-hint">${state.ctxReq[c.id]?t("ctxHintOn"):t("ctxHintOff")}</span>
      </div>`:""}
    </div>`;
}

function sectionHTML(c,s){
  const minLvl = SECTION_LEVELS[s.key]||2;
  const [bk,bl] = statusPair(s.status);
  const head = `
    <div class="sec-head">
      <h3>${secTitle(s.title)}</h3>
      <span class="lvl-pill">L${minLvl}+</span>
      ${badge(bk,bl)}
    </div>`;
  if(state.level < minLvl){
    return `<section class="section">${head}
      <div class="sec-locked">${icons.lock}
        <span><b>${t("lockTitle",{min:minLvl})}</b> ${t("lockBody",{level:state.level})}</span>
      </div></section>`;
  }
  if(state.level===1){ return "" }
  return `<section class="section">${head}<div class="sec-body">${s.findings.map(f=>findingHTML(c,f)).join("")}</div></section>`;
}

const CASE_QA={
 "SR-2026-1187":[

 ],

function qaHTML(id,h){
  return h
    .replace(/<cbtn>(\d+)<\/cbtn>/g,(m,n)=>`<button class="cite" data-case="${id}" data-src="${n}">${n}</button>`)
    .replace(/<sbtn>([\d.]+)<\/sbtn>/g,(m,r)=>`<button class="cite sla" data-sla="${r}">SLA ${r}</button>`);
}
function answerFor(c, text, intentId){
  const q=String(text||"").toLowerCase();
  const hit=intentId
    ? INTENTS.find(i=>i.id===intentId)
    : INTENTS.find(i=>(!i.cases||i.cases.includes(c.id))&&i.keys.some(k=>q.includes(k)));
  if(hit){
    if(state.level<(hit.min||2)) return t("botLevel",{n:state.level});
    if(hit.aKey) return qaHTML(c.id, t(hit.aKey));
    if(hit.id==="hire") return t("botHire");
    const [dn,tt]=c.progress;
    if(hit.id==="duration") return c.completed
      ? t("botDone",{ordered:c.ordered,tt,completed:c.completed})
      : t("botOpen",{ordered:c.ordered,dn,tt,eta:c.eta?t("candEta",{eta:c.eta}):""});
    if(hit.id==="due") return t("botDue",{due:c.due,dueIn:c.dueIn});
    if(hit.id==="eta") return c.eta?t("botEta",{eta:c.eta}):t("botEtaDone",{tt,done:c.completed?` (${c.completed})`:""});
    if(hit.id==="pending"){
      const p=c.sections.filter(s=>s.status==="pending").map(s=>secTitle(s.title));
      return p.length?t("botPending",{list:p.join(", ")}):t("botPendingNone");
    }
    if(hit.id==="source") return (c.sources||[]).length
      ? t("botSources",{n:c.sources.length,list:c.sources.map(s=>s.title).join("; ")})
      : t("botSourcesNone");
    if(hit.id==="discrepancy"){
      const vis=c.sections.filter(s=>state.level>=(SECTION_LEVELS[s.key]||2));
      const ds=[];vis.forEach(s=>s.findings.forEach(f=>{if(f.kind==="discrepancy")ds.push(f.title)}));
      const hidden=c.sections.some(s=>state.level<(SECTION_LEVELS[s.key]||2)&&s.findings.some(f=>f.kind==="discrepancy"));
      if(!ds.length&&!hidden) return t("botNoDisc");
      const head=ds.length===1?t("botDiscOne",{list:ds.join("; ")}):ds.length?t("botDiscMany",{n:ds.length,list:ds.join("; ")}):t("botNoDiscLevel");
      return head+(hidden?t("botDiscHidden"):"");
    }
    if(hit.id==="status") return t("botStatus",{dn,tt,status:c.adjudication,signal:sigLabel(c.signal),adj:adjText(c)});
  }
  return t("botFallback");
}
function chatCard(c){

function wireCites(root){
  root.querySelectorAll(".cite[data-src]:not([data-wired])").forEach(b=>{b.dataset.wired=1;b.addEventListener("click",e=>{e.stopPropagation();openSource(b.dataset.case,+b.dataset.src,b)})});

}
function wireChat(c){
  const log=document.getElementById("chatLog"), inp=document.getElementById("chatIn");
  if(!log) return;
  const send=(text,intent)=>{
    text=(text||"").trim(); if(!text) return;
    log.insertAdjacentHTML("beforeend",`<div class="msg me">${escq(text)}</div>`);
    log.insertAdjacentHTML("beforeend",`<div class="msg ai">${answerFor(c,text,intent)}</div>`);
    wireCites(log);
    log.lastElementChild.scrollIntoView({block:"nearest",behavior:"smooth"});
    inp.value="";
  };
  document.getElementById("chatSend").addEventListener("click",()=>send(inp.value));
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")send(inp.value)});
  document.querySelectorAll("[data-chatq]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.chatq,b.dataset.intent)));
}

function exportSummary(c){
  const lines=[
    "SMART REPORT",
    `${c.name} · ${c.role} · ${c.location}`,
    `Report ${c.id} · Order ${c.order} · Ordered ${c.ordered} · Due ${c.due}`,
    `Signal: ${SIGNAL_LABEL[c.signal]}. ${c.signalReason}`,
    `Adjudication: ${adjOf(c)}`,""];
  c.sections.forEach(s=>{
    const min=SECTION_LEVELS[s.key]||2;
    const bl=(STATUS_BADGE[s.status]||["","-"])[1];
    if(state.level<min){lines.push(`${s.title}: ${bl} (details require Level ${min})`);return}
    lines.push(`${s.title}: ${bl}`);
    if(state.level>=2) s.findings.forEach(f=>{
      lines.push(`  - ${f.title}`);
      if(f.claimed) lines.push(`      stated: ${f.claimed}`);
      if(f.verified) lines.push(`      verified: ${String(f.verified).replace(/<[^>]+>/g,"")}`);
    });
  });
  lines.push("","Exported at access level "+state.level+" · Smart Report prototype, fictional data.");
  return lines.join("\n");
}
function flash(btn,txt){const o=btn.textContent;btn.textContent=txt;setTimeout(()=>{btn.textContent=o},2200)}
const strip=s=>String(s==null?"":s).replace(/<[^>]+>/g,"");
function listXlsx(list){
  const rows=[["Candidate","Role","Location","Report ID","Order no.","Signal","Status","Adjudication","Due","Checks"]];
  list.forEach(c=>{
    const status=c.status==="clear"?"Complete and clear":c.status==="progress"?"In progress":"Needs review";
    rows.push([c.name,c.role,c.location,c.id,c.order,SIGNAL_LABEL[c.signal],status,adjOf(c),c.due,c.progress[0]+" of "+c.progress[1]]);
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:22},{wch:28},{wch:16},{wch:16},{wch:14},{wch:12},{wch:20},{wch:26},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,"Status");
  return new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function pdfBlob(c){
  const doc=new window.jspdf.jsPDF();
  let y=16; const W=180;
  const line=(txt,size=10,bold=false)=>{
    doc.setFontSize(size);doc.setFont("helvetica",bold?"bold":"normal");
    doc.splitTextToSize(txt,W).forEach(l=>{if(y>282){doc.addPage();y=16}doc.text(l,14,y);y+=size*0.5});
    y+=1.5;
  };
  line("Smart Report | Confidential screening report",14,true);
  line(`${c.name} · ${c.role} · ${c.location}`,11,true);
  line(`Report ${c.id} · Order ${c.order} · Ordered ${c.ordered}${c.completed?` · Completed ${c.completed}`:""}`);
  line(`Signal: ${SIGNAL_LABEL[c.signal]}. ${c.signalReason}`);
  line(`Adjudication: ${adjOf(c)} · Exported at access level ${state.level}`);
  y+=3;
  c.sections.forEach(s=>{
    const min=SECTION_LEVELS[s.key]||2;
    const bl=(STATUS_BADGE[s.status]||["","Pending"])[1];
    line(`${s.title}  [${bl}]`,12,true);
    if(state.level<min){line(`Locked: requires Level ${min} access.`);y+=2;return}
    s.findings.forEach(f=>{
      line(`• ${strip(f.title)}`,10,true);
      if(f.claimed)line(`   Stated: ${strip(f.claimed)}`);
      if(f.verified)line(`   Verified: ${strip(f.verified)}`);
      if(f.note)line(`   ${strip(f.note)}`);
    });
    y+=2;
  });
  line("Smart Report prototype, fictional data.",8);
  return doc.output("blob");
}
async function dl(blob,name){
  try{
    if(window.claude&&window.claude.use){
      const d=await window.claude.use("downloads");
      if(d){await d.save({filename:name,data:blob});return}
    }
  }catch(err){}
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const fileSlug=c=>`${c.name.replace(/\s+/g,"_")}_${c.id}`;
async function zipAll(sel,btn){
  if(!(window.JSZip&&window.jspdf))return flash(btn,t("flashExportLibs"));
  const o=btn.textContent;btn.textContent=t("flashZip");
  try{
    const zip=new JSZip();
    sel.forEach(c=>{zip.file(fileSlug(c)+".pdf",pdfBlob(c))});
    const blob=await zip.generateAsync({type:"blob"});
    dl(blob,"smart-report-reports.zip");
    btn.textContent=o;
  }catch(err){btn.textContent=o;flash(btn,t("flashExportFail"))}
}
function exportReport(c,btn){
  let printed=false;
  try{window.print();printed=true}catch(err){}
  if(!printed){
    try{
      navigator.clipboard.writeText(exportSummary(c))
        .then(()=>flash(btn,t("flashCopied")))
        .catch(()=>flash(btn,t("flashUnavailable")));
    }catch(err){flash(btn,t("flashUnavailable"))}
  }
}

const watchBtn=document.getElementById("watchBtn");
const watchPop=document.getElementById("watchPop");
const watchWrap=document.getElementById("watchWrap");
watchBtn.addEventListener("click",()=>{state.watchOpen=!state.watchOpen;renderWatcher()});
watchPop.addEventListener("click",e=>{
  const b=e.target.closest("[data-watch]");
  if(!b) return;
  state.watchOpen=false;
  state.view="report";
  state.caseId=b.dataset.watch;
  render();
  window.scrollTo(0,0);
});
document.addEventListener("click",e=>{
  if(state.watchOpen&&!watchWrap.contains(e.target)){state.watchOpen=false;renderWatcher()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.watchOpen){state.watchOpen=false;renderWatcher();watchBtn.focus()}
});
lvlNote.textContent=t("lvl"+state.level);
updateSlaBtn();
const langSel=document.getElementById("lang");
LANGS.forEach(l=>{
  const o=document.createElement("option");
  o.value=l.id; o.textContent=l.label;
  langSel.appendChild(o);
});
langSel.value=lang;
langSel.addEventListener("change",()=>{setLang(langSel.value);applyChrome();render()});
setLang(lang);
applyChrome();

const INTAKE_MS=60000;
const INTAKE_POOL=[
  {name:"Elena Vasquez",role:"Warehouse Supervisor",location:"Dallas, TX",geo:"DAL",pkg:"Standard package · 4 checks",signal:"critical",status:"review",progress:[4,4],mode:"manual",rules:["4.2"],reason:"County record found that the candidate did not disclose.",
    sections:[
      {key:"identity",title:"Identity verification",status:"verified",findings:[{kind:"match",title:"SSN trace and address history",note:"Trace matches the applicant.",cites:[]}]},
      {key:"criminal",title:"Criminal record search",status:"record",findings:[{kind:"discrepancy",severity:"critical",ctx:true,title:"Dallas County record, not disclosed",claimed:"Application disclosure: “No”",verified:"Misdemeanor on file (2022)",note:"Flagged for individualized assessment before any adverse action.",cites:[]}]}
    ]},
  {name:"Marcus Bell",role:"Staff Accountant",location:"Denver, CO",geo:"DEN",pkg:"Finance package · 5 checks",signal:"attention",status:"review",progress:[5,5],mode:"manual",rules:["3.2"],reason:"Degree conferral date differs by one year from the application.",
    sections:[
      {key:"education",title:"Education",status:"discrepancy",findings:[{kind:"discrepancy",severity:"attention",title:"B.S. Accounting conferral date",claimed:"Conferred May 2018",verified:"Conferred May 2019",note:"Registrar shows conferral one year later than stated.",cites:[]}]}
    ]},
  {name:"Aisha Rahman",role:"Graphic Designer",location:"Portland, OR",geo:"PDX",pkg:"Standard package · 4 checks",signal:"routine",status:"progress",progress:[1,4],mode:"pending",rules:[],reason:"Just ordered: identity verified, remaining checks queued.",
    sections:[
      {key:"identity",title:"Identity verification",status:"verified",findings:[{kind:"match",title:"SSN trace and address history",note:"Trace matches the applicant.",cites:[]}]},
      {key:"employment",title:"Employment history",status:"pending",findings:[{kind:"note",title:"Verifications queued",note:"Employer verifications queued.",cites:[]}]}
    ]},
  {name:"Noah Patel",role:"Operations Analyst",location:"Boston, MA",geo:"BOS",pkg:"Standard package · 4 checks",signal:"critical",status:"review",progress:[4,4],mode:"manual",rules:["2.2"],reason:"Start date at the most recent employer is 8 months later than stated.",
    sections:[
      {key:"employment",title:"Employment history",status:"discrepancy",findings:[{kind:"discrepancy",severity:"critical",title:"Harbor Line Logistics: dates",claimed:"Mar 2022 – present",verified:"Nov 2022 – present",note:"Employer HR confirms a start date 8 months later than stated.",cites:[]}]}
    ]}
];
let intakeSeq=0, intakeCursor=0, nextIntakeAt=Date.now()+INTAKE_MS;
const intakeLog=[];
let intakeRunning=true, intakeRemain=INTAKE_MS;
function intakeClockText(){
  if(!intakeRunning) return t("paused");
  const s=Math.max(0,Math.ceil((nextIntakeAt-Date.now())/1000));
  return t("nextIn",{time:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`});
}
function setIntakeRunning(on){
  if(on===intakeRunning) return;
  if(on) nextIntakeAt=Date.now()+Math.max(0,intakeRemain);
  else intakeRemain=Math.max(0,nextIntakeAt-Date.now());
  intakeRunning=on;
  const sec=document.querySelector(".intake");
  if(sec) sec.classList.toggle("paused",!on);
  const clock=document.getElementById("intakeClock");
  if(clock) clock.textContent=intakeClockText();
  const start=document.getElementById("intakeStart");
  const stop=document.getElementById("intakeStop");
  if(start) start.disabled=on;
  if(stop) stop.disabled=!on;
}
function wireIntake(){
  const start=document.getElementById("intakeStart");
  const stop=document.getElementById("intakeStop");
  if(start) start.addEventListener("click",()=>setIntakeRunning(true));
  if(stop) stop.addEventListener("click",()=>setIntakeRunning(false));
}
function intakeHTML(){
  const rows=intakeLog.length?intakeLog.map(x=>`
    <div class="intake-row">
      ${badge(x.signal,sigLabel(x.signal))}
      <span class="who"><strong>${escq(x.name)}</strong><span>${escq(phrase(x.reason))}</span></span>
      <em>${x.id===state.freshId?t("justIn"):t("received")}</em>
    </div>`).join("")    :`<p class="intake-empty">${t("waiting")}</p>`;
  return `<section class="intake${intakeRunning?"":" paused"}" aria-label="${escq(t("intakeTitle"))}">
    <div class="intake-head">
      <div><h3>${t("intakeTitle")}</h3><p>${t("intakeSub")}</p></div>
      <div class="intake-side">
        <b id="intakeClock">${intakeClockText()}</b>
        <div class="intake-ctrls">
          <button type="button" class="ghost-btn sm" id="intakeStart"${intakeRunning?" disabled":""}>${t("start")}</button>
          <button type="button" class="ghost-btn sm" id="intakeStop"${intakeRunning?"":" disabled"}>${t("stop")}</button>
        </div>
      </div>
    </div>
    ${rows}
  </section>`;
}
function buildIntake(spec){
  intakeSeq+=1;
  const id="SR-2026-"+(1400+intakeSeq);
  const c={
    id, order:"ORD-"+(56100+intakeSeq), name:spec.name, role:spec.role, location:spec.location, geo:spec.geo, pkg:spec.pkg,
    ordered:"Nov 16, 2026", due:"Nov 23, 2026", dueIn:"7 days",
    signal:spec.signal, status:spec.status, progress:spec.progress, signalReason:spec.reason,
    adjudication:spec.status==="review"?"Review required":"Pending", sections:spec.sections, sources:[]
  };
  CASE_ADJ[id]={mode:spec.mode,rules:spec.rules};
  return c;
}
function announceIntake(c){
  const btn=document.getElementById("watchBtn");
  const tip=document.getElementById("watchTip");
  if(!btn||state.role!=="recruiter") return;
  btn.classList.add("incoming");
  if(tip) tip.textContent=t("newIntake",{name:c.name,signal:sigLabel(c.signal)});
  clearTimeout(announceIntake.timer);
  announceIntake.timer=setTimeout(()=>{btn.classList.remove("incoming");renderWatcher()},5000);
}
function arriveIntake(){
  const spec=INTAKE_POOL[intakeCursor%INTAKE_POOL.length];
  intakeCursor+=1;
  const c=buildIntake(spec);
  CASES.push(c);
  intakeLog.unshift(c);
  if(intakeLog.length>4) intakeLog.pop();
  state.freshId=c.id;
  nextIntakeAt=Date.now()+INTAKE_MS;
  if(state.role==="recruiter"&&state.view==="queue") render();
  else renderWatcher();
  announceIntake(c);
}
setInterval(()=>{
  if(!intakeRunning) return;
  if(Date.now()>=nextIntakeAt) arriveIntake();
  else { const el=document.getElementById("intakeClock"); if(el) el.textContent=intakeClockText(); }
},1000);
render();
</script>
</body>
</html>
